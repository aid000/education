<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 Quizbowl · Other Literature</title>
    <style>
        :root { --bg-dark:#16131f; --bg-card:#1e1830; --bg-hover:#2d2348; --accent:#22d3ee;
            --text-primary:#ece9f5; --text-secondary:#ada6c4; --border-color:#352a52; --shadow:0 8px 32px rgba(0,0,0,0.4); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            background:linear-gradient(135deg,var(--bg-dark) 0%,#0d0b14 100%); color:var(--text-primary); line-height:1.7; min-height:100vh; }
        header { position:sticky; top:0; z-index:1000; background:rgba(22,19,31,0.95); backdrop-filter:blur(10px);
            border-bottom:1px solid var(--border-color); box-shadow:var(--shadow); }
        .header-top { max-width:1100px; margin:0 auto; padding:1rem 2rem; }
        .header-title { font-size:1.5rem; font-weight:700; color:var(--accent); }
        .crumb { font-size:0.8rem; color:var(--text-secondary); margin-top:0.2rem; }
        .crumb a { color:var(--accent); text-decoration:none; }
        .container { max-width:1100px; margin:0 auto; padding:2rem; display:flex; flex-direction:column; gap:2rem; }
        .section { background:var(--bg-card); border-radius:12px; padding:2rem; border:1px solid var(--border-color); box-shadow:var(--shadow); }
        .section-header { display:flex; align-items:center; gap:1rem; margin-bottom:1.25rem; padding-bottom:1rem; border-bottom:2px solid var(--border-color); }
        .section-icon { font-size:2.1rem; }
        .section-title { font-size:1.7rem; font-weight:700; color:var(--accent); }
        p { margin-bottom:0.8rem; } .lead { color:var(--text-secondary); }
        .empty { background:rgba(0,0,0,0.2); border:1px dashed var(--border-color); border-radius:10px; padding:2rem; text-align:center; color:var(--text-secondary); }
        .empty .big { font-size:2.4rem; display:block; margin-bottom:0.5rem; }
        a.freq { display:inline-block; margin-top:1rem; padding:0.5rem 1rem; border:1px solid var(--accent); border-radius:8px;
            color:var(--accent); text-decoration:none; font-size:0.9rem; font-weight:600; }
        a.freq:hover { background:var(--bg-hover); }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="header-title">📖 Other Literature</div>
            <div class="crumb"><a href="../index.html">Quizbowl</a> › 📚 Literature › Other Literature</div>
        </div>
    </header>
    <div class="container">
        <section class="section">
            <div class="section-header">
                <span class="section-icon">📖</span>
                <h1 class="section-title">Other Literature</h1>
            </div>
            <p class="lead">Cross-tradition and miscellaneous.</p>
            <div class="empty">
                <span class="big">🚧</span>
                Single-subject study sheets for <strong>Other Literature</strong> are planned.<br>
                Build top-down from the QBReader frequency list (most frequent answers first).
            </div>
            <a class="freq" href="https://www.qbreader.org/db/frequency-list/subcategory?other-literature" target="_blank">📊 QBReader frequency list ↗</a>
        </section>
    </div>
</body>
</html>
